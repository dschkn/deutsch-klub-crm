name: CI and deploy CRM

on:
  push:
    branches: [test-development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-test-development
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE || 'demo' }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: npm run check

      - name: Check deployment configuration
        id: deploy-config
        if: github.event_name == 'push' && github.ref == 'refs/heads/test-development'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: add the four DEPLOY_* repository secrets."
          fi

      - name: Configure SSH
        if: steps.deploy-config.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        if: steps.deploy-config.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          release_dir="/srv/deutsch-klub-crm/releases/${GITHUB_SHA}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release_dir'"
          rsync -az --delete dist/ "$DEPLOY_USER@$DEPLOY_HOST:$release_dir/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "ln -sfn '$release_dir' /srv/deutsch-klub-crm/current && test -f /srv/deutsch-klub-crm/current/index.html"
