name: Deploy CRM Shared Integration

on:
  push:
    branches:
      - nastya-and-dima-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deutsch-klub-crm-nastya-and-dima-development
  cancel-in-progress: true

env:
  DEPLOY_HOST: boatbehind.online
  DEPLOY_USER: deutschklub
  DEPLOY_ROOT: /srv/deutsch-klub/test/crm-shared
  EXPECTED_HOST_FINGERPRINT: SHA256:T3Pj0ugw+blhrlr/bUoRQwEKFT8i+9dc5rw0ztKrZ1U

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout shared integration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: npm run check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | grep -qxF "$EXPECTED_HOST_FINGERPRINT"

      - name: Upload shared integration release
        env:
          RELEASE: ${{ github.sha }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_ROOT/releases/$RELEASE"
          rsync -az --delete dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/releases/$RELEASE/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "ln -sfn $DEPLOY_ROOT/releases/$RELEASE $DEPLOY_ROOT/current"

      - name: Verify shared integration deployment
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "test -f $DEPLOY_ROOT/current/index.html"
